<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gölge Tesisat — termal tarama</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{
  /* Layout idea: hero is a live thermal scan of a wall (visitor drags the lens and finds the leak) — then self-diagnosis tools (symptoms, meter test, house map) lead straight into booking */
  --red:#D50A0A;--red-deep:#A30000;--red-hot:#FF4A4A;--red-tint:#FDECEC;
  --ink:#110D0D;--ink2:#1B1515;--edge:#352B2B;
  --paper:#FFFFFF;--mist:#F7F3F2;--line:#EADFDC;--muted:#6E6260;--dim:#A99D9A;
  --green:#2BD46E;--wa:#1FA855;--ok:#1D8A4E;--amber:#F5B400;--blue:#2D7DD2;--cyan:#38C6F4;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);line-height:.95;margin:0;text-wrap:balance}
p{margin:0}a{color:inherit}button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #FF8A8A;outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
@keyframes flowX{to{background-position:96px 0}}
@keyframes flowY{to{background-position:0 96px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,74,74,.6)}100%{box-shadow:0 0 0 14px rgba(255,74,74,0)}}
@keyframes gpulse{0%{box-shadow:0 0 0 0 rgba(43,212,110,.6)}100%{box-shadow:0 0 0 10px rgba(43,212,110,0)}}
@keyframes ring{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-16deg)}10%,20%,30%{transform:rotate(16deg)}}
@keyframes drip{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(60px) scale(1);opacity:0}}
@keyframes ripple{from{transform:scale(.3);opacity:.8}to{transform:scale(2.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.2}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--red)}
.eyebrow::before{content:"";width:30px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,#FF9A9A 10px 15px);background-size:96px 4px;animation:flowX 1s linear infinite}
.h2{margin-top:14px;font-size:clamp(2.5rem,5vw,4.4rem);font-weight:900;text-transform:uppercase;line-height:.9}
.h2 em{font-style:normal;color:var(--red)}
.lead{margin-top:14px;font-size:1.08rem;color:var(--muted);max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 20px;border-radius:14px;font-weight:800;font-size:.98rem;text-decoration:none;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .2s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 16px 30px -14px rgba(213,10,10,.8)}
.btn-red:hover{background:var(--red-deep)}
.btn-ink{background:var(--ink);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.btn-ghost{background:transparent;border-color:currentColor}
.btn .ring{animation:ring 2.4s infinite}
section{position:relative}
.sec-pad{padding:100px 0}

/* ---------- header ---------- */
.top{background:var(--ink);color:#C9BDBA;font-size:.8rem;font-weight:700}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px}
.top b{color:#fff}
.top .live{display:inline-flex;align-items:center;gap:8px;color:#7BE0A6}
.top .live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:gpulse 1.6s infinite}
.head{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head .wrap{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo span{width:42px;height:42px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.2rem}
.logo b{font-family:var(--display);font-size:1.35rem;text-transform:uppercase;line-height:.9;display:block}
.logo small{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:1px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.9rem;color:var(--muted)}
.nav a:hover{background:var(--mist);color:var(--ink)}
.head .btn{padding:11px 16px;font-size:.9rem}
.crumbs{padding:16px 0 0;font-size:.82rem;font-weight:700;color:var(--muted)}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.crumbs li+li::before{content:"›";margin-right:8px;color:var(--dim)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--red)}
.crumbs [aria-current]{color:var(--ink)}

/* ---------- hero ---------- */
.hero{padding:28px 0 70px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(800px 500px at 85% 20%,rgba(213,10,10,.08),transparent 60%)}
.hero-g{display:grid;grid-template-columns:1fr 1.05fr;gap:44px;align-items:center;margin-top:26px}
.hero-g>*{min-width:0}
.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--red-tint);color:var(--red);font-weight:800;font-size:.82rem}
.tag b{padding:3px 8px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--mono);font-size:.68rem;letter-spacing:1px}
.hero h1{margin-top:18px;font-size:clamp(3rem,5.4vw,4.9rem);font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--red);display:block}
.hero h1 small{display:block;font-size:.42em;letter-spacing:0;color:var(--muted);margin-top:10px;line-height:1}
.hero .lead{font-size:1.12rem}
.hero .lead b{color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.proof{display:grid;grid-template-columns:repeat(4,auto);gap:22px;margin-top:30px;padding-top:22px;border-top:1px dashed var(--line);justify-content:start}
.proof div b{display:block;font-family:var(--display);font-size:2rem;font-weight:900;line-height:1}
.proof div span{font-size:.8rem;font-weight:700;color:var(--muted)}
.proof .st{color:var(--amber);letter-spacing:2px;font-size:.8rem}
/* thermal scanner */
.scan{position:relative;border-radius:30px;background:var(--ink);padding:16px;box-shadow:0 60px 100px -50px rgba(60,0,0,.75)}
.scan-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 6px 12px;font-family:var(--mono);font-size:.72rem;font-weight:700;color:#C9BDBA}
.scan-top .rec{display:inline-flex;align-items:center;gap:7px;color:#FF8A8A}
.scan-top .rec i{width:9px;height:9px;border-radius:50%;background:var(--red-hot);animation:blink 1s infinite}
.wall{position:relative;aspect-ratio:4/3.1;border-radius:20px;overflow:hidden;touch-action:none;cursor:crosshair;user-select:none}
.wall svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.found{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;padding:9px 14px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:.86rem;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:all .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none;box-shadow:0 14px 26px -12px rgba(213,10,10,.9)}
.found.on{opacity:1;transform:translate(-50%,0)}
.found i{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink .8s infinite}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.readout div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--edge);color:#C9BDBA;font-size:.72rem;font-weight:700;font-family:var(--mono)}
.readout b{display:block;color:#fff;font-family:var(--display);font-size:1.5rem;font-weight:900;line-height:1.1}
.readout b.hot{color:var(--red-hot)}
.scan-hint{margin-top:10px;text-align:center;font-size:.8rem;font-weight:700;color:var(--dim)}

/* ---------- strip ---------- */
.strip{background:var(--ink);color:#fff;overflow:hidden;padding:18px 0}
.lane{display:flex;width:max-content;animation:mq 36s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.lane span{display:inline-flex;align-items:center;gap:14px;padding:0 22px;font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;white-space:nowrap}
.lane span::after{content:"";width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--red-hot)}

/* ---------- intro / cost of waiting ---------- */
.intro-g{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:start}
.intro-g>*{min-width:0}
.copy p+p{margin-top:16px}
.copy p{font-size:1.05rem;color:#3D3433}
.copy h3{font-size:1.7rem;text-transform:uppercase;margin:28px 0 10px}
.drop-calc{position:sticky;top:96px;border-radius:28px;background:var(--mist);border:1px solid var(--line);padding:26px;overflow:hidden}
.drop-calc h3{font-size:1.8rem;text-transform:uppercase}
.drop-calc p.s{font-size:.9rem;color:var(--muted);margin-top:6px}
.tap{position:relative;height:150px;margin:18px 0 6px}
.tap svg{width:100%;height:100%}
.tap .dr{animation:drip var(--sp,1.2s) ease-in infinite}
.slider{margin-top:10px}
.slider label{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}
.slider input{width:100%;margin-top:10px;accent-color:var(--red);height:28px}
.calc-out{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.calc-out div{padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.calc-out b{display:block;font-family:var(--display);font-size:2.1rem;font-weight:900;line-height:1;color:var(--red)}
.calc-out span{font-size:.78rem;font-weight:700;color:var(--muted)}
.calc-note{margin-top:12px;font-size:.78rem;color:var(--muted)}

/* ---------- symptoms ---------- */
.sym{background:var(--ink);color:#F4EEEC;overflow:hidden;isolation:isolate}
.sym::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(700px 420px at 100% 0,rgba(213,10,10,.25),transparent 60%)}
.sym .h2{color:#fff}.sym .h2 em{color:var(--red-hot)}.sym .lead{color:#C9BDBA}.sym .eyebrow{color:#FF6B6B}
.sym-g{display:grid;grid-template-columns:1.4fr .8fr;gap:24px;margin-top:40px;align-items:start}
.sym-g>*{min-width:0}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chip{display:grid;grid-template-columns:44px 1fr 26px;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1.5px solid var(--edge);background:rgba(255,255,255,.04);cursor:pointer;text-align:left;transition:all .25s}
.chip:hover{border-color:#6E4A4A}
.chip .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:#FF8A8A}
.chip .ic svg{width:22px;height:22px}
.chip b{display:block;font-size:.95rem;line-height:1.25}
.chip small{display:block;color:var(--dim);font-size:.78rem;margin-top:2px;line-height:1.35}
.chip .bx{width:26px;height:26px;border-radius:8px;border:2px solid #4A3E3E;display:grid;place-items:center;transition:all .25s}
.chip .bx svg{width:14px;height:14px;opacity:0;color:#fff}
.chip[aria-pressed="true"]{border-color:var(--red-hot);background:rgba(213,10,10,.16)}
.chip[aria-pressed="true"] .bx{background:var(--red);border-color:var(--red)}
.chip[aria-pressed="true"] .bx svg{opacity:1}
.verdict{position:sticky;top:96px;border-radius:26px;background:#fff;color:var(--ink);padding:24px;overflow:hidden}
.gauge{position:relative;width:100%;max-width:280px;margin:0 auto}
.gauge svg{width:100%;display:block}
.gauge .g-bg{fill:none;stroke:#EFE6E3;stroke-width:18;stroke-linecap:round}
.gauge .g-fg{fill:none;stroke:url(#gg);stroke-width:18;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.gauge .ndl{transition:transform 1s cubic-bezier(.3,1.4,.5,1);transform-origin:140px 140px}
.g-val{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.g-val b{display:block;font-family:var(--display);font-size:2.6rem;font-weight:900;line-height:1}
.g-val span{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--muted)}
.v-t{margin-top:16px;font-family:var(--display);font-size:1.7rem;font-weight:900;text-transform:uppercase;line-height:1}
.v-p{margin-top:8px;font-size:.92rem;color:var(--muted);min-height:4.2em}
.verdict .btn{width:100%;margin-top:14px}

/* ---------- meter test ---------- */
.meter-g{display:grid;grid-template-columns:.95fr 1.05fr;gap:50px;align-items:center}
.meter-g>*{min-width:0}
.mtr{position:relative;border-radius:30px;background:linear-gradient(160deg,#2A2222,#110D0D);padding:30px;color:#fff;box-shadow:0 50px 90px -50px rgba(0,0,0,.8)}
.dial{position:relative;width:min(320px,100%);aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 40%,#F4F1EC,#D9D2CA);border:10px solid #3A3030;box-shadow:inset 0 6px 14px rgba(0,0,0,.25),0 0 0 4px #1B1515}
.dial .odo{position:absolute;left:50%;top:28%;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border-radius:8px;background:#111}
.dial .odo span{width:24px;height:34px;border-radius:4px;background:#222;color:#fff;font-family:var(--mono);font-weight:700;font-size:1.2rem;display:grid;place-items:center;overflow:hidden}
.dial .odo span.r{background:#8A0000}
.dial .odo span i{display:block;font-style:normal;transition:transform .5s}
.dial small{position:absolute;left:0;right:0;top:19%;text-align:center;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#6E6260;letter-spacing:2px}
.dial .star{position:absolute;left:50%;top:62%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fff;border:3px solid #6E6260}
.dial .star svg{width:100%;height:100%}
.dial .star.spin svg{animation:spin 1.2s linear infinite}
.dial .lbl2{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#6E6260}
.m-ctrl{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.m-ctrl button{padding:11px 16px;border-radius:12px;border:1.5px solid #4A3E3E;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.m-ctrl button[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.m-res{margin-top:14px;text-align:center;font-weight:700;color:#C9BDBA;min-height:3em;font-size:.92rem}
.m-res b{color:#fff}
.steps4{counter-reset:s;display:grid;gap:12px;margin-top:26px}
.st4{display:grid;grid-template-columns:54px 1fr;gap:16px;align-items:start;padding:16px;border-radius:20px;border:1.5px solid var(--line);background:#fff;transition:border-color .3s,box-shadow .3s}
.st4.on{border-color:var(--red);box-shadow:0 18px 34px -24px rgba(213,10,10,.7)}
.st4 .n{width:54px;height:54px;border-radius:16px;background:var(--mist);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.6rem;transition:all .3s}
.st4.on .n{background:var(--red);color:#fff}
.st4 h3{font-size:1.4rem;text-transform:uppercase}
.st4 p{margin-top:4px;color:var(--muted);font-size:.95rem}

/* ---------- methods ---------- */
.meth{background:var(--mist)}
.meth-g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:40px}
.mc{position:relative;padding:22px 18px;border-radius:24px;background:#fff;border:1.5px solid var(--line);overflow:hidden;isolation:isolate;transition:transform .35s,box-shadow .35s;min-width:0}
.mc:hover{transform:translateY(-6px);box-shadow:0 30px 50px -34px rgba(0,0,0,.45)}
.mc .viz{height:110px;border-radius:16px;margin-bottom:16px;overflow:hidden;position:relative;background:var(--ink)}
.mc .viz svg{width:100%;height:100%;display:block}
.mc h3{font-size:1.45rem;text-transform:uppercase}
.mc p{margin-top:8px;font-size:.9rem;color:var(--muted);line-height:1.5}
.mc .use{margin-top:12px;font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--red);letter-spacing:.5px}
.tb{animation:tbm 3s ease-in-out infinite alternate}
@keyframes tbm{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.wv{animation:wv 1.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes wv{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.camx{animation:camx 4s ease-in-out infinite alternate}
@keyframes camx{from{transform:translateX(0)}to{transform:translateX(150px)}}
.pneedle{transform-origin:100px 80px;animation:pn 4s ease-in-out infinite}
@keyframes pn{0%,20%{transform:rotate(40deg)}70%,100%{transform:rotate(-10deg)}}
.mbar{animation:mb 2.4s ease-in-out infinite alternate;transform-origin:bottom;transform-box:fill-box}
@keyframes mb{from{transform:scaleY(.3)}to{transform:scaleY(1)}}

/* ---------- house map ---------- */
.house-g{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;margin-top:40px;align-items:center}
.house-g>*{min-width:0}
.house{position:relative;border-radius:28px;background:linear-gradient(180deg,#F1ECEA,#E6DEDB);padding:16px;overflow:hidden}
.house svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs circle.c{fill:var(--red);stroke:#fff;stroke-width:3;transition:r .3s}
.hs circle.p{fill:none;stroke:var(--red);stroke-width:2;animation:ripple 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.hs text{font-family:var(--display);font-weight:900;font-size:13px;fill:#fff;pointer-events:none}
.hs.on circle.c{fill:var(--ink)}
.hs:focus{outline:none}.hs:focus-visible circle.c{stroke:#FF8A8A;stroke-width:5}
.spot{border-radius:26px;background:var(--ink);color:#fff;padding:26px;min-height:360px;display:flex;flex-direction:column;gap:12px}
.spot small{font-family:var(--mono);font-size:.72rem;font-weight:700;color:#FF8A8A;letter-spacing:1px}
.spot h3{font-size:2.1rem;text-transform:uppercase}
.spot p{color:#D9CFCC;font-size:.98rem}
.spot ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.spot li{display:flex;gap:10px;font-size:.92rem;color:#F4EEEC;font-weight:600}
.spot li svg{width:16px;height:16px;color:var(--green);flex:none;margin-top:4px}
.spot .nav2{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.spot .nav2 button{flex:1;padding:12px;border-radius:12px;border:1.5px solid #4A3E3E;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.spot .nav2 button.b{background:var(--red);border-color:var(--red)}
.spot.swap>*{animation:up .4s both}

/* ---------- compare ---------- */
.cmp{margin-top:40px;border-radius:28px;overflow:hidden;border:1.5px solid var(--line)}
.cmp-r{display:grid;grid-template-columns:1.1fr 1fr 1fr;border-top:1px solid var(--line)}
.cmp-r:first-child{border-top:0}
.cmp-r>div{padding:16px 20px;font-size:.95rem;min-width:0}
.cmp-r>div:first-child{font-weight:800}
.cmp-r>div:nth-child(2){color:var(--muted)}
.cmp-r>div:nth-child(3){background:#FFF7F7;font-weight:700}
.cmp-h>div{font-family:var(--display);font-size:1.4rem;font-weight:900;text-transform:uppercase;padding-top:20px;padding-bottom:20px}
.cmp-h>div:nth-child(2){background:var(--mist);color:var(--muted)}
.cmp-h>div:nth-child(3){background:var(--red);color:#fff}
.x,.v{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-right:8px;vertical-align:-4px}

footer{background:#0B0808;color:#A99D9A;font-size:.86rem;padding:30px 0 100px}
