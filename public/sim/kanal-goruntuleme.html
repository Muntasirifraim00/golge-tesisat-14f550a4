<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gölge Tesisat — animasyon</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>

:root{
  
  --red:#D50A0A;--red-deep:#A30000;--red-hot:#FF4A4A;--red-tint:#FDECEC;
  --ink:#110D0D;--ink2:#1A1414;--edge:#352B2B;--edge2:#4A3E3E;
  --paper:#FFFFFF;--mist:#F7F3F2;--line:#EADFDC;--muted:#6E6260;--dim:#A99D9A;--soft:#C9BDBA;
  --green:#2BD46E;--wa:#1FA855;--ok:#1D8A4E;--amber:#F5B400;--sea:#2D7DD2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--display);line-height:.95;margin:0;text-wrap:balance}
p{margin:0}a{color:inherit}button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #FF8A8A;outline-offset:3px}
.num{font-variant-numeric:tabular-nums}.ico{width:18px;height:18px;flex:none}
.wrap{max-width:1260px;margin:0 auto;padding:0 22px}
@keyframes flowX{to{background-position:96px 0}}
@keyframes flowY{to{background-position:0 96px}}
@keyframes gpulse{0%{box-shadow:0 0 0 0 rgba(43,212,110,.6)}100%{box-shadow:0 0 0 10px rgba(43,212,110,0)}}
@keyframes rpulse{0%{box-shadow:0 0 0 0 rgba(255,74,74,.6)}100%{box-shadow:0 0 0 12px rgba(255,74,74,0)}}
@keyframes ring{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-16deg)}10%,20%,30%{transform:rotate(16deg)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes mq{to{transform:translateX(-50%)}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--red)}
.eyebrow::before{content:"";width:30px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,#FF9A9A 10px 15px);background-size:96px 4px;animation:flowX 1s linear infinite}
.h2{margin-top:14px;font-size:clamp(2.5rem,5vw,4.4rem);font-weight:900;text-transform:uppercase;line-height:.9;overflow-wrap:break-word}
.h2 em{font-style:normal;color:var(--red)}
.lead{margin-top:14px;font-size:1.06rem;color:var(--muted);max-width:680px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 18px;border-radius:14px;font-weight:800;font-size:.96rem;text-decoration:none;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 16px 30px -14px rgba(213,10,10,.8)}.btn-red:hover{background:var(--red-deep)}
.btn-ink{background:var(--ink);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.btn-line{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost{background:transparent;border-color:var(--edge2);color:#fff}
.ring{animation:ring 2.4s infinite}
section{position:relative}
.sec{padding:96px 0}
.dark{background:var(--ink);color:#F4EEEC;overflow:hidden;isolation:isolate}
.dark::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(700px 420px at 100% 0,rgba(213,10,10,.25),transparent 60%)}
.dark .h2{color:#fff}.dark .h2 em{color:var(--red-hot)}.dark .lead{color:var(--soft)}.dark .eyebrow{color:#FF6B6B}
.mist{background:var(--mist)}

/* header */
.top{background:var(--ink);color:var(--soft);font-size:.8rem;font-weight:700}
.top .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px}
.top b{color:#fff}.top .live{display:inline-flex;align-items:center;gap:8px;color:#7BE0A6}
.top .live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:gpulse 1.6s infinite}
.head{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head .wrap{display:flex;align-items:center;gap:18px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo span{width:42px;height:42px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.2rem}
.logo b{font-family:var(--display);font-size:1.35rem;text-transform:uppercase;line-height:.9;display:block}
.logo small{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:1px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:9px 11px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.88rem;color:var(--muted)}
.nav a:hover{background:var(--mist);color:var(--ink)}
.head .btn{padding:11px 16px;font-size:.9rem}

/* hero */
.hero{padding:22px 0 60px;background:linear-gradient(180deg,#FBF8F6,#fff)}
.crumbs{font-size:.82rem;font-weight:700;color:var(--muted)}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.crumbs li+li::before{content:"›";margin-right:8px;color:var(--dim)}
.crumbs a{text-decoration:none}.crumbs [aria-current]{color:var(--ink)}
.hero-g{display:grid;grid-template-columns:.86fr 1.14fr;gap:36px;align-items:center;margin-top:22px}
.hero-g>*{min-width:0}
.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--red-tint);color:var(--red);font-weight:800;font-size:.82rem}
.tag b{padding:3px 8px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--mono);font-size:.66rem;letter-spacing:1px}
.hero h1{margin-top:16px;font-size:clamp(2.9rem,5.4vw,5rem);font-weight:900;text-transform:uppercase;line-height:.86}
.hero h1 em{font-style:normal;color:var(--red);display:block}
.hero h1 small{display:block;font-size:.4em;color:var(--muted);margin-top:10px;letter-spacing:.3px;line-height:1.1}
.hero .lead{font-size:1.1rem}.hero .lead b{color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.proof{display:grid;grid-template-columns:repeat(4,auto);gap:22px;margin-top:26px;padding-top:20px;border-top:1px dashed var(--line);justify-content:start}
.proof b{display:block;font-family:var(--display);font-size:2rem;font-weight:900;line-height:1}
.proof span{font-size:.8rem;font-weight:700;color:var(--muted)}
.proof .st{color:var(--amber);letter-spacing:2px;font-size:.8rem}
/* theater */
.th{border-radius:30px;background:var(--ink);color:#fff;overflow:hidden;box-shadow:0 60px 100px -50px rgba(60,0,0,.75)}
.th-top{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap}
.th-top small{font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--dim);letter-spacing:1px}
.fx{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--edge);overflow-x:auto;scrollbar-width:none;max-width:100%}
.fx::-webkit-scrollbar{display:none}
.fx button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--soft);font-weight:800;font-size:.82rem;padding:8px 11px;border-radius:10px;cursor:pointer;transition:all .2s}
.fx button svg{width:16px;height:16px}
.fx button[aria-pressed="true"]{background:var(--red);color:#fff}
.screen{position:relative;aspect-ratio:8/5.2;background:#0B0808}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.state{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;background:rgba(17,13,13,.8);backdrop-filter:blur(6px);font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:1px;border:1px solid rgba(255,255,255,.12)}
.state i{width:9px;height:9px;border-radius:50%;background:var(--red-hot);animation:rpulse 1.4s infinite}
.state.fixing{color:var(--amber)}.state.fixing i{background:var(--amber)}
.state.fixed{color:#7BE0A6}.state.fixed i{background:var(--green);animation:gpulse 1.4s infinite}
.meters{display:grid;gap:6px;min-width:150px;padding:8px 10px;border-radius:12px;background:rgba(17,13,13,.8);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.meters div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--soft)}
.meters i{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.meters i b{position:absolute;inset:0;width:0;border-radius:6px}
.meters em{font-style:normal;color:#fff;min-width:32px;text-align:right}
.th-cap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--edge)}
.th-cap p{font-size:.9rem;font-weight:700;color:#F4EEEC;min-height:2.6em}
.th-cap p small{display:block;font-family:var(--mono);font-size:.62rem;color:#FF8A8A;letter-spacing:1px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.seg button{border:0;background:none;color:var(--soft);font-weight:800;font-size:.78rem;padding:7px 10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.tl{height:4px;background:rgba(255,255,255,.08)}.tl i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red-hot),var(--amber) 60%,var(--green))}

/* strip */
.strip{background:var(--ink);color:#fff;overflow:hidden;padding:16px 0}
.lane{display:flex;width:max-content;animation:mq 40s linear infinite}
.lane span{display:inline-flex;align-items:center;gap:14px;padding:0 20px;font-family:var(--display);font-weight:800;font-size:1.45rem;text-transform:uppercase;white-space:nowrap}
.lane span::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red-hot)}

/* intro */
.intro-g{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:start}
.intro-g>*{min-width:0}
.copy p{font-size:1.06rem;color:#3D3433}
.copy p+p{margin-top:16px}
.copy h3{font-size:1.7rem;text-transform:uppercase;margin:28px 0 10px}
.urg{position:sticky;top:96px;border-radius:28px;background:var(--mist);border:1px solid var(--line);padding:24px}
.urg h3{font-size:1.8rem;text-transform:uppercase}
.urg p.s{margin-top:6px;color:var(--muted);font-size:.92rem}
.lv{display:grid;gap:10px;margin-top:16px}
.lvi{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px;border-radius:18px;background:#fff;border:1.5px solid var(--line)}
.lvi .d{width:14px;height:14px;border-radius:50%;margin-top:4px;background:var(--c)}
.lvi b{display:block;font-size:1rem}
.lvi span{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.lvi em{display:inline-block;margin-top:6px;font-style:normal;font-family:var(--mono);font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--mist)}

/* where */
.wh-tabs{display:flex;gap:6px;margin-top:30px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.wh-tabs::-webkit-scrollbar{display:none}
.wt{flex:none;display:inline-flex;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .2s}
.wt svg{width:20px;height:20px;color:var(--red)}
.wt[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.wt[aria-selected="true"] svg{color:var(--red-hot)}
.wpanel{margin-top:14px;display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;border-radius:28px;border:1.5px solid var(--line);background:#fff;overflow:hidden}
.wpanel>*{min-width:0}
.wp-art{position:relative;background:linear-gradient(160deg,#1B1515,#110D0D);min-height:340px;display:grid;place-items:center;overflow:hidden}
.wp-art svg{width:100%;height:100%;max-height:380px}
.wp-b{padding:26px 26px 26px 6px;display:flex;flex-direction:column;gap:14px}
.wp-b h3{font-size:2.2rem;text-transform:uppercase}
.wp-b .tr{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--red);letter-spacing:1px}
.wp-b p{color:#3D3433}
.wp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wp-cols div{padding:14px;border-radius:16px;background:var(--mist)}
.wp-cols small{display:block;font-family:var(--mono);font-size:.64rem;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.wp-cols ul{margin:0;padding-left:18px;font-size:.9rem;color:#3D3433}
.wp-cols li+li{margin-top:3px}
.wp-m{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--red-tint);font-size:.9rem;font-weight:700;color:var(--red-deep)}
.wp-m svg{width:20px;height:20px;flex:none}
.wp-b .btn{align-self:flex-start}

/* severity explorer */
.sev{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:center;margin-top:36px}
.sev>*{min-width:0}
.xs{position:relative;border-radius:28px;background:rgba(255,255,255,.04);border:1px solid var(--edge);padding:22px}
.xs svg{display:block;width:100%;height:auto}
.xs-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:16px}
.xs input[type=range]{width:100%;accent-color:var(--red-hot);height:28px}
.xs .pct{font-family:var(--display);font-size:2.4rem;font-weight:900;line-height:1;min-width:84px;text-align:right}
.sev-i h3{font-size:2.4rem;text-transform:uppercase;color:#fff}
.sev-i .ph{display:inline-flex;margin-top:10px;padding:6px 12px;border-radius:999px;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:1px}
.sev-i p{margin-top:12px;color:#D9CFCC;font-size:1.02rem}
.sev-i ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.sev-i li{display:flex;gap:10px;font-weight:600;color:#F4EEEC}
.sev-i li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:9px;background:var(--red-hot)}
.flowbar{position:relative;height:46px;margin-top:16px;border-radius:24px;background:#2A2121;overflow:hidden;box-shadow:inset 0 3px 6px rgba(0,0,0,.4)}
.flowbar canvas{width:100%;height:100%;display:block}

/* causes */
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:36px}
.cc{position:relative;padding:20px;border-radius:24px;background:#fff;border:1.5px solid var(--line);overflow:hidden;isolation:isolate;transition:transform .35s,box-shadow .35s,border-color .3s;min-width:0}
.cc:hover{transform:translateY(-5px);box-shadow:0 30px 50px -38px rgba(80,0,0,.5);border-color:#F1B5B5}
.cc .v{height:96px;border-radius:16px;background:#1B1515;margin-bottom:14px;overflow:hidden}
.cc .v svg{width:100%;height:100%;display:block}
.cc h3{font-size:1.4rem;text-transform:uppercase}
.cc p{margin-top:6px;font-size:.9rem;color:var(--muted)}
.cc .w{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:.64rem;font-weight:700;color:var(--red);letter-spacing:.5px}

/* quiz */
.qz{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:start;margin-top:30px}
.qz>*{min-width:0}
.qbox{border-radius:28px;background:#fff;border:1.5px solid var(--line);padding:24px;box-shadow:0 30px 60px -50px rgba(0,0,0,.5)}
.qprog{display:flex;gap:6px}.qprog i{flex:1;height:6px;border-radius:6px;background:#EFE6E3;transition:background .3s}.qprog i.on{background:var(--red)}
.qbox .qn{margin-top:14px;font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--red)}
.qbox h3{margin-top:6px;font-size:2rem;text-transform:uppercase}
.qo{display:grid;gap:8px;margin-top:14px}
.qo button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.95rem;cursor:pointer;text-align:left;transition:all .2s}
.qo button:hover{border-color:var(--red);transform:translateX(3px)}
.qo button i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--mist);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:900;color:var(--red)}
.qres{animation:up .4s both}
.qres .rc{margin-top:14px;padding:18px;border-radius:20px;background:var(--ink);color:#fff}
.qres .rc small{font-family:var(--mono);font-size:.66rem;font-weight:700;color:#FF8A8A;letter-spacing:1px}
.qres .rc b{display:block;font-family:var(--display);font-size:1.8rem;text-transform:uppercase;line-height:1;margin-top:6px}
.qres .rc p{margin-top:8px;color:#D9CFCC;font-size:.94rem}
.qres .rc .m{display:inline-flex;margin-top:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:800;font-size:.82rem}
.qres .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qback{margin-top:12px;border:0;background:none;color:var(--muted);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* DIY */
.diy{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:36px}
.diy>*{min-width:0}
.dcol{border-radius:28px;padding:24px;border:1.5px solid var(--line);background:#fff}
.dcol h3{display:flex;align-items:center;gap:10px;font-size:1.9rem;text-transform:uppercase}
.dcol h3 i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:1.1rem}
.dcol.do h3 i{background:#E6F6EC;color:var(--ok)}
.dcol.dont{background:#FFF8F8;border-color:#F5D1D1}
.dcol.dont h3 i{background:var(--red-tint);color:var(--red)}
.dl{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px;counter-reset:d}
.dl li{display:grid;grid-template-columns:34px 1fr;gap:12px}
.dl li::before{counter-increment:d;content:counter(d);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.2rem;background:var(--mist)}
.dcol.do .dl li::before{background:#E6F6EC;color:var(--ok)}
.dcol.dont .dl li::before{content:"✕";background:var(--red-tint);color:var(--red);font-size:.95rem}
.dl b{display:block;font-size:1rem}
.dl span{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
.never{margin-top:18px;border-radius:24px;background:var(--ink);color:#fff;padding:22px}
.never h3{font-size:1.6rem;text-transform:uppercase}
.never-g{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:14px}
.nv{padding:12px 8px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--edge);text-align:center;font-size:.78rem;font-weight:700;color:var(--soft)}
.nv span{display:block;font-size:1.6rem;margin-bottom:4px}

/* methods */
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:36px}
.mc{border-radius:24px;background:rgba(255,255,255,.04);border:1px solid var(--edge);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .35s,border-color .3s}
.mc:hover{transform:translateY(-5px);border-color:#6E4A4A}
.mc .v{height:120px;border-radius:16px;background:#0B0808;overflow:hidden}
.mc .v svg{width:100%;height:100%;display:block}
.mc h3{font-size:1.5rem;text-transform:uppercase;color:#fff}
.mc .tr{font-family:var(--mono);font-size:.66rem;font-weight:700;color:#FF8A8A;letter-spacing:.5px}
.mc p{font-size:.9rem;color:var(--soft)}

(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const io=(els,fn,th)=>{if(!('IntersectionObserver' in window)){els.forEach(fn);return;}const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){fn(e.target);o.unobserve(e.target);}}),{threshold:th||.15});els.forEach(e=>o.observe(e));};
const KW=['Kanal görüntüleme','Drain camera','Recorded video','Exact distances','Kök','Cracks','Sags','Collapses','No digging to look','Fixed price · VAT incl.'];
const row=KW.map(k=>'<span>'+k+'</span>').join('');$('#lane').innerHTML=row+row;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;

/* ============ shared tunnel renderer (used by hero, library, report) ============ */
/* draw a camera view into ctx of size w,h. kind: root|crack|sag|block|offset|collapse|object|scale|clean ; z = travel distance in m ; defectAt = m ; t time ; repaired bool */
function tunnel(c,w,h,kind,z,defectAt,t,repaired,material){
  const cx0=w/2,cy0=h/2+h*.02,R=Math.min(w,h)*.62;c.fillStyle='#000';c.fillRect(0,0,w,h);
  const wall=material==='pvc'?[150,140,128]:[120,110,100];
  /* depth rings */for(let d=0.15;d<=12;d+=.07){const s=1/(d*.9+.35);const r=R*s;if(r<2)continue;const L=clamp(1.15/(d+.3),0,1);const ph=((z+d)%1.2)<.05;
    const col=ph?'rgb('+Math.round(wall[0]*L*.55)+','+Math.round(wall[1]*L*.55)+','+Math.round(wall[2]*L*.55)+')':'rgb('+Math.round(wall[0]*L)+','+Math.round(wall[1]*L)+','+Math.round(wall[2]*L)+')';
    c.fillStyle=col;c.beginPath();c.arc(cx0,cy0,r,0,7);c.fill();}
  c.fillStyle='#000';c.beginPath();c.arc(cx0,cy0,R*.06,0,7);c.fill();
  /* water at the bottom */const sag=kind==='sag'&&!repaired;const lvl=sag?.42:.12;
  const pts=[];for(let d=0.15;d<=12;d+=.2){const s=1/(d*.9+.35),r=R*s;let l=lvl;if(sag){const dd=defectAt-z;l=lvl*clamp(1-Math.abs(d-dd)/2.2,.15,1);}const hw=r*Math.sqrt(1-(1-l)*(1-l));pts.push([cx0-hw,cy0+r*(1-l),cx0+hw,d]);}
  const wg=c.createLinearGradient(0,cy0,0,h);wg.addColorStop(0,'rgba(20,28,34,.95)');wg.addColorStop(1,'rgba(80,110,128,.9)');c.fillStyle=wg;c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));for(let i=pts.length-1;i>=0;i--)c.lineTo(pts[i][2],pts[i][1]);c.closePath();c.fill();
  c.strokeStyle='rgba(200,230,255,.18)';c.lineWidth=1.5;for(let i=0;i<pts.length;i+=4){const q=pts[i];const ww=(q[2]-q[0]);c.beginPath();c.moveTo(q[0]+ww*.2,q[1]+Math.sin(t*3+i)*1);c.lineTo(q[2]-ww*.2,q[1]+Math.sin(t*3+i)*1);c.stroke();}
  /* defect */const dd=defectAt-z;if(!repaired&&dd>-0.3&&dd<9&&kind!=='clean'){const s=1/(Math.max(dd,.05)*.9+.35),r=R*s;const L=clamp(1.15/(Math.max(dd,0)+.3),0,1);c.save();c.translate(cx0,cy0);
    if(kind==='root'){c.strokeStyle='rgba('+Math.round(190*L)+','+Math.round(150*L)+','+Math.round(90*L)+',1)';c.lineCap='round';for(let i=0;i<9;i++){const a=-Math.PI*.9+i*.22;c.lineWidth=Math.max(1,r*.05*(1-i%3*.25));c.beginPath();c.moveTo(Math.cos(a)*r,Math.sin(a)*r);c.quadraticCurveTo(Math.cos(a)*r*.4+Math.sin(t+i)*r*.05,Math.sin(a)*r*.4+r*.3,Math.cos(a+.3)*r*.1,r*.5+i*r*.02);c.stroke();}}
    else if(kind==='crack'){c.strokeStyle='rgba(10,8,6,.95)';c.lineWidth=Math.max(1.5,r*.03);c.beginPath();c.moveTo(-r*.3,-r*.95);c.lineTo(-r*.2,-r*.6);c.lineTo(-r*.35,-r*.3);c.lineTo(-r*.15,r*.1);c.lineTo(-r*.3,r*.5);c.stroke();c.fillStyle='rgba(120,170,200,'+(.5*L)+')';for(let i=0;i<4;i++){c.beginPath();c.arc(-r*.25,-r*.4+((t*80+i*r*.3)%(r*1.2)),Math.max(1,r*.02),0,7);c.fill();}}
    else if(kind==='block'){c.fillStyle='rgba('+Math.round(200*L)+','+Math.round(170*L)+','+Math.round(90*L)+',1)';c.beginPath();c.ellipse(0,r*.2,r*.95,r*.75,0,0,7);c.fill();c.fillStyle='rgba(0,0,0,.6)';c.beginPath();c.ellipse(r*.1,-r*.25,r*.18,r*.12,0,0,7);c.fill();}
    else if(kind==='offset'){c.fillStyle='rgba('+Math.round(60*L)+','+Math.round(55*L)+','+Math.round(50*L)+',1)';c.beginPath();c.arc(0,0,r,0,7);c.arc(r*.18,-r*.12,r*.85,0,7,true);c.fill('evenodd');}
    else if(kind==='collapse'){c.fillStyle='rgba('+Math.round(110*L)+','+Math.round(90*L)+','+Math.round(70*L)+',1)';c.beginPath();c.moveTo(-r,-r*.2);c.lineTo(-r*.3,-r*.6);c.lineTo(r*.2,-r*.1);c.lineTo(r*.6,-r*.5);c.lineTo(r,0);c.lineTo(r,r);c.lineTo(-r,r);c.fill();}
    else if(kind==='object'){c.fillStyle='rgba('+Math.round(213*L)+',20,20,1)';c.save();c.rotate(.4);c.fillRect(-r*.35,r*.35,r*.7,r*.25);c.restore();}
    else if(kind==='scale'){c.strokeStyle='rgba('+Math.round(200*L)+','+Math.round(190*L)+','+Math.round(160*L)+',1)';c.lineWidth=r*.15;c.beginPath();c.arc(0,0,r*.9,0,7);c.stroke();}
    c.restore();
    if(dd<4&&dd>0){c.strokeStyle='rgba(255,74,74,'+(.6+.4*Math.sin(t*6))+')';c.lineWidth=2;c.setLineDash([6,5]);c.beginPath();c.arc(cx0,cy0,r*.7,0,7);c.stroke();c.setLineDash([]);}}
  /* camera light vignette */const g=c.createRadialGradient(cx0,cy0,R*.15,cx0,cy0,Math.max(w,h)*.75);g.addColorStop(0,'rgba(255,240,200,.08)');g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');c.fillStyle=g;c.fillRect(0,0,w,h);
  /* scanlines */c.fillStyle='rgba(255,255,255,.025)';for(let y=0;y<h;y+=3)c.fillRect(0,y,w,1);}
function hud(c,w,h,z,t,txt){c.save();const s=w/800;c.scale(s,s);const W2=800,H2=h/s;c.font='700 16px "JetBrains Mono",monospace';c.fillStyle='#7BE0A6';c.fillText(z.toFixed(2)+' m',24,H2-26);c.fillStyle=Math.sin(t*5)>0?'#FF4A4A':'#7A1A1A';c.beginPath();c.arc(W2-120,H2-32,7,0,7);c.fill();c.fillStyle='#fff';c.fillText('KAYIT',W2-106,H2-26);c.fillStyle='rgba(255,255,255,.7)';c.font='700 13px "JetBrains Mono",monospace';c.fillText('Ø110 · EĞİM 0°',24,H2-50);
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;const m=20;[[m,m,1,1],[W2-m,m,-1,1],[m,H2-m,1,-1],[W2-m,H2-m,-1,-1]].forEach(k=>{c.beginPath();c.moveTo(k[0],k[1]+k[3]*24);c.lineTo(k[0],k[1]);c.lineTo(k[0]+k[2]*24,k[1]);c.stroke();});
  if(txt){c.font='700 15px "JetBrains Mono",monospace';const tw=c.measureText(txt.t).width+22;c.fillStyle='rgba(17,13,13,.88)';c.beginPath();c.roundRect?c.roundRect(W2/2-tw/2,H2-70,tw,30,8):c.rect(W2/2-tw/2,H2-70,tw,30);c.fill();c.fillStyle=txt.c;c.fillText(txt.t,W2/2-tw/2+11,H2-50);}
  c.restore();}

/* ====================== HERO ====================== */
const cv=$('#cv'),cx=cv.getContext('2d');
function fit(){const r=$('#screen').getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(300,Math.round(r.width*dpr));cv.height=Math.max(200,Math.round(r.height*dpr));}
const K={
 root:{n:'Kök',at:7.4,label:'7,4 m’DE KÖK GİRİŞİ',cap:['Kamera bahçe hattında ilerliyor — 7,4 metrede kökler bir ekten içeri girmiş ve geçen her şeyi tutuyor.','Kökler makineyle kesilir, ek içeriden yalıtılır ya da bölüm değiştirilir.','Onarım sonrası: aynı ek, temiz ve yalıtılmış — tam akış.']},
 crack:{n:'Çatlak',at:5.1,label:'5,1 m’DE BOYUNA ÇATLAK',cap:['5,1 metrede borunun üstü boyunca çatlak — su toprağa sızıyor, içeri toprak girebiliyor.','Zemin sadece 5,1 metrede açılır; çatlak bölüm değiştirilip test edilir.','Onarım sonrası: yeni bölüm, düzgün ekler, sızıntı yok.']},
 sag:{n:'Çökme',at:6.2,label:'6,2 m’DE ÇÖKME · DURGUN SU',cap:['Boru 6,2 metrede zeminin altında çökmüş — su ve yağ çukurda birikiyor, gider sürekli tıkanıyor.','Zemin tam o noktada açılır, bölüm doğru eğimle yeniden döşenir.','Onarım sonrası: düzgün eğim, durgun su yok.']},
 block:{n:'Yağ tıkanıklığı',at:4.3,label:'4,3 m’DE YAĞ BİRİKİMİ',cap:['4,3 metredeki kalın yağ tıkacı mutfak hattını neredeyse kapatmış.','Hat makine ve yüksek basınçlı suyla açılır; kontrol için ikinci kamera çekimi yapılır.','Temizlik sonrası: temiz boru duvarları, tam kesit.']}};
let sel='root',z=0;const T_P=7,T_F=3,T_D=4,TOT=T_P+T_F+T_D;let clock=0,mode='auto',running=false,last=0,phase='',user=false;
function fAt(c){if(mode==='problem')return 0;if(mode==='fixed')return 1;if(c<T_P)return 0;if(c<T_P+T_F)return (c-T_P)/T_F;return 1;}
function draw(){const k=K[sel];const f=fAt(clock);const w=cv.width,h=cv.height;let txt=null;
  if(f===0){z=Math.min(k.at-.9,clock*1.1);tunnel(cx,w,h,sel,z,k.at,clock,false);if(z>k.at-2.2)txt={t:'⚠ '+k.label,c:'#FF8A8A'};}
  else if(f<1){/* static wipe: "processing" */tunnel(cx,w,h,sel,k.at-.9,k.at,clock,f>.5);cx.fillStyle='rgba(0,0,0,'+(.8*Math.sin(f*Math.PI))+')';cx.fillRect(0,0,w,h);for(let i=0;i<300*Math.sin(f*Math.PI);i++){cx.fillStyle='rgba(255,255,255,'+Math.random()*.4+')';cx.fillRect(Math.random()*w,Math.random()*h,2,2);}txt={t:f<.5?'TEMİZLENİYOR / ONARILIYOR…':'İKİNCİ KAMERA ÇEKİMİ',c:'#F5D27A'};z=k.at-.9;}
  else{z=(k.at-2)+((clock-(mode==='fixed'?0:T_P+T_F))*.7)%4;tunnel(cx,w,h,sel,z,k.at,clock,true);txt={t:'✓ ONARIM SONRASI · AÇIK',c:'#7BE0A6'};}
  hud(cx,w,h,z,clock,txt);return f;}
function frame(now){if(!running)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;clock+=dt;
  if(mode==='auto'&&clock>=TOT){if(!user){const ks=Object.keys(K);setSel(ks[(ks.indexOf(sel)+1)%ks.length],true);}else{clock=0;phase='';}}
  const f=draw();const ph=f===0?'problem':f<1?'fixing':'fixed';if(ph!==phase){phase=ph;$('#state').className='state'+(ph==='problem'?'':' '+ph);$('#stT').textContent=ph==='problem'?'İNCELENİYOR':ph==='fixing'?'ONARILIYOR':'DOĞRULANDI';$('#capS').textContent=ph==='problem'?'KAMERA NE GÖRÜYOR · '+K[sel].n.toUpperCase():ph==='fixing'?'NE YAPIYORUZ':'SONUÇ';$('#capT').textContent=K[sel].cap[ph==='problem'?0:ph==='fixing'?1:2];}
  $('#mF').style.width=clamp(z/10*100,0,100)+'%';$('#mFv').textContent=Math.max(0,z).toFixed(1)+'m';const fl=f>=1?100:(sel==='block'||sel==='sag'?35:sel==='root'?50:80);$('#mC').style.width=fl+'%';$('#mCv').textContent=fl+'%';
  $('#tlI').style.width=(mode==='auto'?clock/TOT*100:mode==='fixed'?100:Math.min(100,clock/T_P*100))+'%';
  requestAnimationFrame(frame);}
function run(on){if(on&&!running){running=true;last=performance.now();requestAnimationFrame(frame);}else if(!on)running=false;}
function setSel(k,auto){sel=k;clock=0;phase='';$$('#fx button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));if(!auto){user=true;const b=$('#fx button[aria-pressed="true"]');b.parentElement.scrollTo({left:b.offsetLeft-b.parentElement.offsetLeft-8,behavior:'smooth'});}if(!running)draw();}
$$('#fx button').forEach(b=>b.addEventListener('click',()=>{setSel(b.dataset.k);buzz();}));
$$('.seg button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;user=true;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));clock=0;phase='';buzz();}));
fit();addEventListener('resize',()=>{fit();if(!running)draw();});
if(RM){mode='fixed';$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m==='fixed'));}
draw();
if('IntersectionObserver' in window)new IntersectionObserver(es=>run(es[0].isIntersecting&&!document.hidden),{threshold:.15}).observe($('#screen'));else run(true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)run(false);});



/* ---- embed bridge: parent pauses us off-screen; we report our height ---- */
addEventListener('message',function(e){if(e.data&&typeof e.data.gtSim==='boolean'){try{run(e.data.gtSim&&!document.hidden);}catch(_){}}});
(function(){var last=0;function rep(){var h=Math.ceil(document.querySelector('.th').getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({gtSimH:h,id:location.pathname},'*');}}
if('ResizeObserver' in window)new ResizeObserver(rep).observe(document.querySelector('.th'));addEventListener('load',rep);setTimeout(rep,300);})();

})();</script></body></html>
